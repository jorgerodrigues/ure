name: Native app checks

on:
  push:
    branches: [w002-recoverable-library]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting, Debug build, and isolated unit tests
        run: make check XCODE_EXTRA_FLAGS='-parallel-testing-enabled NO'
      - name: Build optimized Release
        run: make release
